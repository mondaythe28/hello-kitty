<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffc1d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Surat Cinta untuk Lisa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff5d8f' d='M16 28s-9-5.6-12.2-11C2 13.4 3.2 8.8 7.2 8.2 10 7.8 12 9.4 16 13c4-3.6 6-5.2 8.8-4.8 4 .6 5.2 5.2 3.4 8.8C25 22.4 16 28 16 28z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #6d3148;
    --deep: #a1265c;
    --rose: #e23b78;
    --blush: #ffd6e7;
    --cream: #fff8fb;
    --card: #fffafc;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #ffd6e8;
    color: var(--ink);
    font-family: "Nunito", "Segoe UI", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  button, input { font-family: inherit; }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    display: block;
  }
  .hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + var(--safe-top)) 12px 8px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 250, 252, 0.92);
    border: 2px solid rgba(255, 182, 208, 0.95);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 6px 16px rgba(214, 92, 140, 0.12);
    font-weight: 800;
    font-size: 14px;
    color: var(--deep);
  }
  .pill.ready { background: #fff4c8; border-color: #f3d48a; }
  .lives { display: flex; gap: 2px; }
  .lives span { opacity: 0.28; filter: grayscale(1); }
  .lives span.on { opacity: 1; filter: none; }
  #heart-count.pop, #gift-count.pop { animation: pop 0.35s ease; display: inline-block; }
  @keyframes pop { 40% { transform: scale(1.22); } }
  .music {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 250, 252, 0.92);
    border: 2px solid rgba(255, 182, 208, 0.95);
    border-radius: 999px;
    padding: 4px 10px 4px 4px;
    box-shadow: 0 6px 16px rgba(214, 92, 140, 0.12);
  }
  .music button, .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 0;
    background: #ffe4ef;
    color: var(--rose);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }
  .music button.on {
    background: var(--rose);
    color: white;
    animation: glow 1.8s ease-in-out infinite;
  }
  @keyframes glow {
    50% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(226, 59, 120, 0.15); }
  }
  .music label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--deep); }
  .music input[type="range"] {
    width: 88px;
    accent-color: var(--rose);
    cursor: pointer;
  }
  .hud-tools { display: flex; align-items: center; gap: 8px; }
  .lang-field {
    display: grid;
    gap: 6px;
    margin: 6px 0 16px;
    font-weight: 800;
    color: var(--deep);
  }
  .lang-field select {
    width: 100%;
    min-height: 48px;
    border-radius: 16px;
    border: 2px solid #ffd0e2;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-weight: 800;
    padding: 8px 12px;
  }
  .screens {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: calc(var(--hud-pad, 78px) + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    pointer-events: none;
    overflow: auto;
  }
  .panel {
    pointer-events: auto;
    width: min(460px, 100%);
    background:
      radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.95), transparent 42%),
      linear-gradient(180deg, #fffdfd, #fff3f8);
    border: 2px solid #ffd0e2;
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(214, 92, 140, 0.18);
    padding: 22px 22px 18px;
    position: relative;
  }
  .panel.finale {
    background: rgba(255, 250, 252, 0.82);
    text-align: center;
    margin-top: 2vh;
  }
  .kicker {
    margin: 0 0 4px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 800;
    color: #d15b8c;
  }
  h1, h2 {
    font-family: "Pacifico", "Segoe Script", cursive;
    font-weight: 400;
    color: var(--deep);
    margin: 0 0 8px;
    line-height: 1.15;
  }
  h1 { font-size: clamp(32px, 8vw, 48px); }
  h2 { font-size: clamp(28px, 6vw, 40px); }
  .lede, .sub { margin: 0 0 14px; font-size: 16px; line-height: 1.45; }
  #screen-finale .sub { white-space: pre-line; }
  .steps { display: grid; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
  .steps li {
    background: #fff;
    border-radius: 16px;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    border: 2px solid #ffe0ec;
    font-weight: 700;
  }
  .steps i {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: #ffe4ef;
    font-style: normal;
    flex: none;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button.primary, button.ghost {
    border-radius: 999px;
    padding: 12px 18px;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    min-height: 48px;
  }
  button.primary { background: var(--rose); color: white; border: 0; }
  button.ghost { background: transparent; color: var(--deep); border: 2px solid #f3a8c4; }
  button.primary:hover, button.ghost:hover { transform: translateY(-1px); }
  .seal {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    margin: 4px auto 10px;
    display: grid;
    place-items: center;
    color: white;
    font-size: 26px;
    background: radial-gradient(circle at 35% 30%, #ff9ebb, #e23b78 62%, #c42a66);
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.08), 0 8px 16px rgba(226, 59, 120, 0.25);
  }
  .letter-body {
    font-family: "Pacifico", "Segoe Script", cursive;
    font-size: 22px;
    line-height: 1.45;
    color: #8d3a5c;
    margin: 8px 0 6px;
  }
  .sign { text-align: right; font-weight: 800; margin: 0 0 8px; }
  .perfect { display: inline-block; background: #fff4c8; border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 13px; }
  .pips { display: flex; gap: 6px; justify-content: center; margin: 8px 0 12px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: #ffd0e2; display: block; }
  .pips i.on { background: var(--rose); }
  .note-list { display: grid; gap: 8px; margin: 10px 0 14px; max-height: min(46vh, 360px); overflow: auto; }
  .note {
    border-radius: 16px;
    padding: 10px 12px;
    background: #fff;
    border: 2px solid #ffe0ec;
  }
  .note strong { display: block; color: var(--deep); }
  .note p { margin: 4px 0 0; }
  .note.locked { opacity: 0.72; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .tabs button {
    border-radius: 999px;
    border: 2px solid #ffd0e2;
    background: #fff;
    color: var(--deep);
    font-weight: 800;
    padding: 8px 12px;
    min-height: 40px;
  }
  .tabs button.on { background: var(--rose); color: #fff; border-color: var(--rose); }
  .fortune {
    width: 100%;
    text-align: left;
    background: #fff8e8;
    border: 2px solid #f3d48a;
    border-radius: 18px;
    padding: 10px 12px;
    margin: 0 0 12px;
    color: var(--deep);
  }
  .fortune strong { display: block; color: #b56a12; letter-spacing: 0.04em; font-size: 13px; }
  .fortune p { margin: 4px 0 0; font-weight: 800; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-row button.on { outline: 3px solid var(--rose); }
  .chip-row button:disabled { opacity: 0.55; cursor: default; }
  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(108px + var(--safe-bottom));
    transform: translateX(-50%);
    z-index: 6;
    width: min(520px, calc(100% - 24px));
    text-align: center;
    background: rgba(255, 250, 252, 0.94);
    border: 2px solid #ffd0e2;
    color: var(--deep);
    font-weight: 800;
    border-radius: 18px;
    padding: 10px 14px;
    box-shadow: 0 10px 24px rgba(214, 92, 140, 0.14);
  }
  .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 7;
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    padding: 8px 14px calc(12px + var(--safe-bottom));
    pointer-events: none;
  }
  .controls .pad { display: flex; gap: 10px; pointer-events: auto; }
  .controls button { pointer-events: auto; }
  .controls button {
    width: 74px;
    height: 74px;
    border-radius: 24px;
    border: 2px solid #ffc2d8;
    background: rgba(255, 250, 252, 0.94);
    color: var(--rose);
    font-size: 28px;
    font-weight: 800;
    box-shadow: 0 8px 18px rgba(214, 92, 140, 0.16);
    touch-action: none;
  }
  .controls button:active { transform: translateY(2px); background: #ffe4ef; }
  .jump { width: auto !important; min-width: 96px; padding: 0 18px; border-radius: 28px !important; font-size: 20px; }
  body.panel-open .controls { display: none !important; }
  body.show-controls .controls { display: flex; }
  @media (pointer: coarse), (max-width: 860px) {
    body:not(.panel-open) .controls { display: flex; }
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  :focus-visible { outline: 3px solid #7a3050; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .music button.on, #heart-count.pop, #gift-count.pop { animation: none; }
  }
  @media (max-height: 520px) {
    .panel { padding: 14px; }
    .lede, .steps { display: none; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" data-i18n-aria="canvas"></canvas>

<header class="hud">
  <div class="stats">
    <div class="pill" id="lives"><span class="lives"></span></div>
    <div class="pill" id="heart-pill"><span aria-hidden="true">♥</span> <span data-i18n="hearts"></span> <b id="heart-count">0/8</b></div>
    <div class="pill" id="gift-pill"><span id="gift-emoji" aria-hidden="true">🎁</span> <b id="gift-count">0/2</b></div>
    <div class="pill" id="level-pill">1/5</div>
    <button class="icon-btn" id="btn-pause" type="button" data-i18n-aria="hud.pause" hidden>Ⅱ</button>
  </div>
  <div class="hud-tools">
    <button class="icon-btn" id="btn-settings" type="button" data-i18n-aria="settings">⚙</button>
    <div class="music" role="group" data-i18n-aria="music.group">
      <button id="music-toggle" type="button" aria-pressed="false" data-i18n-aria="music.play">♪</button>
      <label><span data-i18n="music.soft"></span>
        <span class="sr" data-i18n="music.volume"></span>
        <input id="volume" type="range" min="0" max="100" value="65" data-i18n-aria="music.volume">
      </label>
    </div>
  </div>
</header>

<p id="hint" class="hint" hidden></p>

<div class="controls" id="controls">
  <div class="pad">
    <button id="btn-left" type="button" data-i18n-aria="controls.left">←</button>
    <button id="btn-right" type="button" data-i18n-aria="controls.right">→</button>
  </div>
  <button id="btn-jump" class="jump" type="button" data-i18n="controls.hop" data-i18n-aria="controls.jump"></button>
</div>

<div class="screens" id="screens">
  <section id="screen-start" class="panel">
    <p class="kicker" data-i18n="intro.kicker"></p>
    <h1 data-i18n="intro.title"></h1>
    <p class="lede" data-i18n="intro.lede"></p>
    <div class="fortune" id="fortune-card">
      <strong data-i18n="fortune.title"></strong>
      <p id="fortune-quote"></p>
    </div>
    <ul class="steps">
      <li><i>♥</i><span data-i18n="intro.stepHeart"></span></li>
      <li><i>☂</i><span data-i18n="intro.stepCloud"></span></li>
      <li><i>✉</i><span data-i18n="intro.stepMail"></span></li>
    </ul>
    <div class="row">
      <button class="primary" id="btn-begin" type="button" data-i18n="start"></button>
      <button class="ghost" id="btn-notes-start" type="button" data-i18n="intro.notes"></button>
      <button class="ghost sleep-btn" id="btn-sleep-start" type="button" data-i18n="intro.sleep" hidden></button>
    </div>
  </section>

  <section id="screen-letter" class="panel" hidden>
    <div class="seal" aria-hidden="true">♥</div>
    <p class="kicker" id="letter-kicker"></p>
    <h2 id="letter-title" data-i18n="letter.title"></h2>
    <div class="pips" id="letter-pips"></div>
    <p class="letter-body" id="letter-body"></p>
    <p class="sign" data-i18n="letter.sign"></p>
    <p id="letter-perfect" hidden><span class="perfect" data-i18n="letter.perfect"></span></p>
    <div class="row">
      <button class="primary" id="btn-next" type="button"></button>
    </div>
  </section>

  <section id="screen-over" class="panel" hidden>
    <p class="kicker" data-i18n="over.kicker"></p>
    <h2 data-i18n="over.title"></h2>
    <p class="sub" data-i18n="over.body"></p>
    <button class="primary" id="btn-retry" type="button" data-i18n="over.retry"></button>
  </section>

  <section id="screen-pause" class="panel" hidden>
    <p class="kicker" data-i18n="pause.kicker"></p>
    <h2 data-i18n="pause.title"></h2>
    <p class="sub" data-i18n="pause.body"></p>
    <div class="row">
      <button class="primary" id="btn-resume" type="button" data-i18n="pause.resume"></button>
      <button class="ghost" id="btn-notes-pause" type="button" data-i18n="pause.notes"></button>
      <button class="ghost" id="btn-restart" type="button" data-i18n="pause.restart"></button>
      <button class="ghost sleep-btn" id="btn-sleep-pause" type="button" data-i18n="intro.sleep" hidden></button>
    </div>
  </section>

  <section id="screen-notes" class="panel" hidden>
    <p class="kicker" data-i18n="notes.kicker"></p>
    <h2 data-i18n="notes.title"></h2>
    <div class="tabs" id="book-tabs">
      <button type="button" data-book="letters" data-i18n="book.letters"></button>
      <button type="button" data-book="compliments" data-i18n="book.compliments"></button>
      <button type="button" data-book="memories" data-i18n="book.memories"></button>
      <button type="button" data-book="wardrobe" data-i18n="book.wardrobe"></button>
    </div>
    <div class="note-list" id="note-list"></div>
    <button class="primary" id="btn-notes-back" type="button" data-i18n="notes.back"></button>
  </section>

  <section id="screen-settings" class="panel" hidden>
    <p class="kicker" data-i18n="menu.kicker"></p>
    <h2 data-i18n="settings"></h2>
    <label class="lang-field">
      <span data-i18n="menu.language"></span>
      <select id="lang-select"></select>
    </label>
    <button class="primary" id="btn-settings-close" type="button" data-i18n="menu.close"></button>
  </section>

  <section id="screen-finale" class="panel finale" hidden>
    <p class="kicker" data-i18n="finale.kicker"></p>
    <h1 data-i18n="finale.title"></h1>
    <p class="sub" data-i18n="finale.body"></p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="btn-again" type="button" data-i18n="finale.again"></button>
      <button class="ghost" id="btn-notes-finale" type="button" data-i18n="finale.letters"></button>
    </div>
  </section>
</div>

  function emptyBook() {
    return {
      giftKeys: [],
      letters: [],
      outfits: [],
      equipped: "",
      pets: [],
      sleepDone: false,
      memories: [],
      fortune: null,
      seenEnding: false,
      secretSeen: false
    };
  }

  function loadBook() {
    const blank = emptyBook();
    try {
      const raw = JSON.parse(localStorage.getItem(BOOK_KEY) || "null");
      if (!raw || typeof raw !== "object") return blank;
      blank.giftKeys = Array.isArray(raw.giftKeys) ? raw.giftKeys : [];
      blank.letters = Array.isArray(raw.letters) ? raw.letters.filter((n) => n >= 0 && n < 5) : [];
      blank.outfits = Array.isArray(raw.outfits) ? raw.outfits.filter((id) => OUTFIT_IDS.includes(id)) : [];
      blank.equipped = OUTFIT_IDS.includes(raw.equipped) ? raw.equipped : (blank.outfits[blank.outfits.length - 1] || "");
      blank.pets = Array.isArray(raw.pets) ? raw.pets.filter((id) => PET_IDS.includes(id)) : [];
      blank.sleepDone = !!raw.sleepDone;
      blank.memories = Array.isArray(raw.memories) ? raw.memories : [];
      blank.fortune = raw.fortune && raw.fortune.day ? raw.fortune : null;
      blank.seenEnding = !!raw.seenEnding;
      blank.secretSeen = !!raw.secretSeen;
    } catch (err) { /* keep the blank book */ }
    return blank;
  }

  let progress = loadBook();

  function saveBook() {
    try { localStorage.setItem(BOOK_KEY, JSON.stringify(progress)); } catch (err) { /* ignore */ }
  }

  function collectionComplete() {
    return OUTFIT_IDS.every((id) => progress.outfits.includes(id))
      && PET_IDS.every((id) => progress.pets.includes(id))
      && progress.sleepDone
      && progress.letters.length >= LEVELS.length;
  }

  function refreshUnlocks() {
    const found = [];
    const count = progress.giftKeys.length;
    OUTFIT_IDS.forEach((id) => {
      if (count >= OUTFIT_AT[id] && !progress.outfits.includes(id)) {
        progress.outfits.push(id);
        progress.equipped = id;
        found.push(id);
      }
    });
    const petReady = {
      butterfly: progress.letters.length > 0 || progress.outfits.includes("bow"),
      bunny: progress.outfits.includes("garden"),
      kitten: !!progress.sleepDone
    };
    PET_IDS.forEach((id) => {
      if (petReady[id] && !progress.pets.includes(id)) {
        progress.pets.push(id);
        found.push(id);
      }
    });
    if (progress.sleepDone && !progress.memories.includes("sleep")) progress.memories.push("sleep");
    if (collectionComplete() && !progress.memories.includes("thanks")) progress.memories.push("thanks");
    saveBook();
    syncWorldButtons();
    if (found.length) {
      hintUnlockKey = `unlock.${found[0]}`;
      toast("unlock");
    }
    return found.length > 0;
  }

  function fortuneIndex() {
    const day = new Date().toISOString().slice(0, 10);
    const count = 7;
    if (!progress.fortune || progress.fortune.day !== day) {
      let index = [...day].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % count;
      if (progress.fortune && progress.fortune.index === index) index = (index + 1) % count;
      progress.fortune = { day, index };
      saveBook();
    }
    return progress.fortune.index;
  }

  function renderFortune() {
    const quote = document.getElementById("fortune-quote");
    if (quote) quote.textContent = t(`fortune.q${fortuneIndex()}`);
  }

  function syncWorldButtons() {
    const open = progress.outfits.includes("sleep");
    document.querySelectorAll(".sleep-btn").forEach((btn) => { btn.hidden = !open; });
  }

  function equipOutfit(id) {
    if (!progress.outfits.includes(id)) return;
    progress.equipped = id;

    renderNotes();
  }

  const petals = Array.from({ length: 16 }, () => ({

    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);

  function needList() {

    if (dh > 0) bits.push(t(dh === 1 ? "toast.heart" : "toast.hearts", { n: dh }));
    if (dg > 0) bits.push(t(dg === 1 ? "toast.gift" : "toast.gifts", { n: dg }));

  function makeFlowers(width, seed) {
    const rand = mulberry32(seed);
    const list = [];
    for (let x = 20; x < width; x += 34) {
      if (rand() < 0.62) {
        list.push({ x: x + rand() * 16, k: rand() < 0.55 ? 0 : 1, s: 0.7 + rand() * 0.6 });
      }
    }
    return list;
  }

  function beginRun(level, tipKind) {
    level.platforms.forEach((p) => {
      if (p.baseX == null) p.baseX = p.x;
      p.x = p.baseX;
      p.dx = 0;
    });
    level.clouds.forEach((c) => { c.base = c.x; c.t = Math.random() * 3; });
    [level.berries, level.bees, level.butterflies].forEach((list) => {
      (list || []).forEach((m) => {
        if (m.base == null) m.base = m.x;
        m.x = m.base;
        m.t = Math.random() * 2;
      });
    });
    level.pickups.forEach((item, i) => {
      item.got = false;
      item.phase = i * 0.7;
      item.saveId = `${state.levelKind}-${state.levelIndex}-${i}`;
      if (!item.kind) item.kind = "letter";
      if (item.follow != null) item.ox = item.x - level.platforms[item.follow].x;
    });
    state.lives = 3;
    state.kitty.x = 110;
    state.kitty.y = GROUND_Y;
    state.kitty.vx = 0;
    state.kitty.vy = 0;
    state.kitty.onGround = true;
    state.kitty.facing = 1;
    state.checkpoint = 110;
    state.camX = 0;
    state.invuln = 0;

      state.particles.push({

  function ensureAudio() {
    if (audio) return;

    volume.gain.value = volAmount();

    music.gain.value = 0.0001;
    const sfx = ctxA.createGain();
    sfx.gain.value = 0.8;
    const delay = ctxA.createDelay();
    delay.delayTime.value = 0.22;
    const feedback = ctxA.createGain();
    feedback.gain.value = 0.18;
    const wet = ctxA.createGain();

    music.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(wet);
    wet.connect(volume);

  function volAmount() {

  function scheduleMusic() {
    if (!audio || !musicOn) return;
    const ctxA = audio.ctx;
    const eighth = 60 / 76 / 2;
    const melody = [0, 4, 7, 4, 9, 7, 4, 2, 0, 4, 7, 12, 9, 7, 4, 0, 2, 7, 11, 7, 9, 4, 2, 0, -5, -1, 0, 2, 4, 2, null, null];

    osc.stop(when + dur + 0.02);

    kitty.x = state.checkpoint || 110;
    kitty.y = GROUND_Y;
    kitty.vx = 0;
    kitty.vy = 0;
    kitty.onGround = true;
    sfx("hurt");
    burst(kitty.x, kitty.y - 40, "#ffb7d0", 8, "heart");
    syncHud();
    if (state.lives <= 0) {
      state.mode = "over";
      showScreen("over");
      pauseBtn.hidden = true;
    }
  }

  function update(dt) {
    const level = current();
    const kitty = state.kitty;
    state.time += dt;
    if (state.invuln > 0) state.invuln -= dt;
    if (state.tear > 0) state.tear -= dt;
    if (hintTimer > 0) {
      hintTimer -= dt;
      if (hintTimer <= 0) hintEl.hidden = true;
    }

    level.platforms.forEach((p) => {
      if (p.span) {
        const nx = p.baseX + Math.sin(state.time * p.speed + p.phase) * p.span;
        p.dx = nx - p.x;
        p.x = nx;
      } else p.dx = 0;
    });
    level.clouds.forEach((c) => {
      c.t += dt;
      c.x = c.base + Math.sin(c.t * c.speed) * c.range;
      c.yDraw = c.y + Math.sin(state.time * 1.4 + c.base) * 6;
    });
    const sway = (m) => {
      if (m.base == null) m.base = m.x;
      m.t += dt;
      m.x = m.base + Math.sin(m.t * m.speed) * m.range;
    };
    (level.berries || []).forEach(sway);
    (level.bees || []).forEach(sway);
    (level.butterflies || []).forEach((m) => {
      sway(m);
      m.yDraw = m.y + Math.sin(state.time * 2.2 + m.base) * 8;
    });
    level.pickups.forEach((item) => {
      if (item.follow == null) return;
      const p = level.platforms[item.follow];
      item.x = p.x + item.ox;
      item.y = p.y - 46;
    });

    state.particles.forEach((p) => {
      p.life -= dt;
      p.vy += 40 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    });
    state.particles = state.particles.filter((p) => p.life > 0);

    const goal = quotaMet() ? 1 : 0;
    state.flag += (goal - state.flag) * Math.min(1, dt * 4);

    if (state.phase === "clearing") {
      state.clearT -= dt;
      kitty.vx *= 0.8;
      kitty.vy += GRAVITY * dt;
      kitty.y += kitty.vy * dt;
      if (kitty.y > GROUND_Y) { kitty.y = GROUND_Y; kitty.vy = -180; }
      if (state.clearT <= 0) openLetter();
      updateCamera();
      return;
    }

    if (state.mode !== "play") {
      updateCamera();
      return;
    }

    const dir = (keys.right || buttons.right ? 1 : 0) - (keys.left || buttons.left ? 1 : 0);
    if (dir) kitty.facing = dir;
    const inPatch = kitty.onGround && (level.patches || []).some((p) => kitty.x > p.x && kitty.x < p.x + p.w);
    const target = dir * MOVE_SPEED * (inPatch ? 0.48 : 1);
    const blend = Math.min(1, (kitty.onGround ? 12 : 7) * dt);
    kitty.vx += (target - kitty.vx) * blend;
    if (state.jumpLock > 0) state.jumpLock -= dt;
    if (state.jumpBuf > 0) {
      state.jumpBuf -= dt;
      if ((kitty.onGround || state.coyote > 0) && state.jumpLock <= 0) {
        kitty.vy = JUMP_V;
        kitty.onGround = false;
        state.coyote = 0;
        state.jumpBuf = 0;
        state.jumpLock = 0.16;
        sfx("jump");
      }
    }

    if (kitty.riding) kitty.x += kitty.riding.dx || 0;
    const prevX = kitty.x;
    const prevY = kitty.y;
    kitty.vy = Math.min(980, kitty.vy + GRAVITY * dt);
    kitty.x += kitty.vx * dt;
    kitty.y += kitty.vy * dt;
    kitty.x = clamp(kitty.x, 46, level.width - 46);

    let landed = false;
    let riding = null;
    if (kitty.vy >= 0) {
      level.platforms.forEach((p) => {
        const overlap = kitty.x > p.x + 8 && kitty.x < p.x + p.w - 8;
        if (overlap && prevY <= p.y + 8 && kitty.y >= p.y && kitty.y <= p.y + 36) {
          kitty.y = p.y;
          kitty.vy = 0;
          landed = true;
          riding = p;
        }
      });
      const inGap = (level.gaps || []).some((g) => kitty.x > g.x + 8 && kitty.x < g.x + g.w - 8);
      if (!landed && !inGap && prevY <= GROUND_Y && kitty.y >= GROUND_Y) {
        kitty.y = GROUND_Y;
        kitty.vy = 0;
        landed = true;
      }
    }
    const half = 18;
    for (const h of level.hurdles || []) {
      const top = GROUND_Y - h.h;
      const left = h.x;
      const right = h.x + h.w;
      const overlap = kitty.x + half > left && kitty.x - half < right;
      if (!overlap) continue;
      if (kitty.vy >= 0 && prevY <= top + 6 && kitty.y >= top && kitty.y <= top + 30) {
        kitty.y = top;
        kitty.vy = 0;
        landed = true;
      } else if (kitty.y > top + 8) {
        kitty.x = prevX <= (left + right) / 2 ? left - half : right + half;
        kitty.vx = 0;
      }
    }
    kitty.onGround = landed;
    kitty.riding = riding;
    if (landed) state.coyote = 0.12;
    else state.coyote -= dt;

    const inBrook = !landed && (level.gaps || []).some((g) => kitty.x > g.x && kitty.x < g.x + g.w);
    state.checkpoint = 110;
    for (const mark of level.checks || []) {
      if (kitty.x >= mark) state.checkpoint = mark;
    }
    (level.butterflies || []).forEach((b) => {
      const dy = (kitty.y - 36) - (b.yDraw || b.y);
      if (Math.hypot(b.x - kitty.x, dy) < 50) {
        const push = Math.cos(b.t * b.speed) >= 0 ? 1 : -1;
        kitty.vx += push * 110 * dt;
        kitty.vx = clamp(kitty.vx, -210, 210);
      }
    });
    if (inBrook && kitty.y > GROUND_Y + 54) loseLife();

    const bodyY = kitty.y - 40;
    level.pickups.forEach((item) => {
      if (item.got) return;
      const iy = item.y + Math.sin(state.time * 2.5 + item.phase) * (reduceMotion ? 0 : 7);
      if (Math.hypot(item.x - kitty.x, iy - bodyY) < 46) {
        item.got = true;
        if (item.type === "heart") {
          sfx("heart");
          burst(item.x, iy, "#ff5d8f", 8, "heart");
          pop(heartsEl);
          if (quotaMet() && state.flag < 0.2) toast("ready");
        } else {
          sfx("gift");
          burst(item.x, iy, "#ffc14d", 8, "star");
          pop(giftsEl);
          let unlockedNow = false;
          if (item.saveId && !progress.giftKeys.includes(item.saveId)) {
            progress.giftKeys.push(item.saveId);
            unlockedNow = refreshUnlocks();
          }
          if (!unlockedNow && quotaMet() && state.flag < 0.2) toast("ready");
        }
        syncHud();
      }
    });

    if (state.invuln <= 0 && state.mode === "play") {
      for (const c of level.clouds) {
        if (c.y < 320) continue;
        if (Math.hypot(c.x - kitty.x, c.yDraw - (kitty.y - 30)) < 42) {
          loseLife();
          break;
        }
      }
      if (state.mode === "play" && kitty.y > GROUND_Y - 36) {
        for (const berry of level.berries || []) {
          if (Math.abs(berry.x - kitty.x) < 40 && Math.abs((GROUND_Y - 16) - kitty.y) < 36) {
            loseLife();
            break;
          }
        }
      }
      if (state.mode === "play") {
        for (const bee of level.bees || []) {
          const beeY = bee.y + Math.sin(state.time * 3) * 3;
          if (Math.hypot(bee.x - kitty.x, beeY - (kitty.y - 24)) < 34) {
            loseLife();
            break;
          }
        }
      }
    }

    const box = level.width - 150;
    if (Math.abs(kitty.x - box) < 46 && kitty.y > GROUND_Y - 70) {
      if (quotaMet()) {
        state.phase = "clearing";
        state.clearT = 1.15;
        sfx("send");
        burst(box, GROUND_Y - 70, "#ff5d8f", 16, "heart");
      } else if (hintTimer < 1) {
        toast("need");
      }
    }

    updateCamera();
  }

  function drawHeart(x, y, size, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0.3);
    ctx.bezierCurveTo(-0.05, 0.12, -0.55, 0.05, -0.55, -0.28);
    ctx.bezierCurveTo(-0.55, -0.62, -0.15, -0.72, 0, -0.42);
    ctx.bezierCurveTo(0.15, -0.72, 0.55, -0.62, 0.55, -0.28);
    ctx.bezierCurveTo(0.55, 0.05, 0.05, 0.12, 0, 0.3);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.beginPath();
    ctx.ellipse(-0.22, -0.28, 0.12, 0.08, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCloud(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, 26 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 22 * s, y + 6 * s, 18 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 22 * s, y + 6 * s, 18 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawWorry(c) {
    const x = c.x;
    const y = c.yDraw;
    ctx.fillStyle = "rgba(140,160,190,0.18)";
    ctx.beginPath();
    ctx.ellipse(x, y + 28, 34, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    drawCloud(x, y, 1.15, "#d5e3f7");
    drawCloud(x - 4, y - 2, 0.7, "#c3d4ee");
    ctx.fillStyle = "#6d7c99";
    ctx.beginPath();
    ctx.ellipse(x - 10, y - 2, 2.2, 3.2, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 8, y - 2, 2.2, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#6d7c99";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(x - 1, y + 10, 6, 0.2, Math.PI - 0.2);
    ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const dropY = ((state.time * 70 + i * 28) % 64);
      ctx.fillStyle = "rgba(120, 180, 230, 0.85)";
      ctx.beginPath();
      ctx.ellipse(x - 18 + i * 12, y + 22 + dropY, 2.2, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFlower(x, y, s, kind) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    if (kind === 0) {
      ctx.fillStyle = "#7dce9a";
      ctx.fillRect(-1.5, 0, 3, 14);
      ctx.fillStyle = "#ffe56a";
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * 6, Math.sin(a) * 6 - 8, 4, 2.4, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#ff8fb8";
      ctx.beginPath();
      ctx.arc(0, -8, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ff7eae";
      ctx.beginPath();
      ctx.ellipse(0, -8, 5, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#7dce9a";
      ctx.fillRect(-1.2, -2, 2.4, 14);
    }
    ctx.restore();
  }

  function drawGift(x, y, kind) {
    ctx.save();
    ctx.translate(x, y);
    if (kind === "flower") drawFlower(0, 8, 1.15, 0);
    else if (kind === "macaron") {
      ctx.fillStyle = "#ffd0e4";
      ctx.beginPath();
      ctx.ellipse(0, 2, 14, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(-12, -2, 24, 5);
      ctx.fillStyle = "#ff8fbe";
      ctx.beginPath();
      ctx.ellipse(0, -4, 14, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (kind === "pillow") {
      ctx.fillStyle = "#fff6fb";
      roundRect(-16, -8, 32, 18, 8);
      ctx.fill();
      ctx.fillStyle = "#ffd0e4";
      roundRect(-16, -8, 12, 18, 8);
      ctx.fill();
    } else if (kind === "blanket") {
      ctx.fillStyle = "#d9c8ff";
      roundRect(-16, -10, 32, 20, 6);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(-16, -2, 32, 4);
      ctx.fillStyle = "#ff8fbe";
      ctx.fillRect(-16, 6, 32, 4);
    } else if (kind === "phone") {
      ctx.fillStyle = "#3a3140";
      roundRect(-8, -14, 16, 26, 4);
      ctx.fill();
      ctx.fillStyle = "#ffe7f2";
      roundRect(-6, -11, 12, 18, 2);
      ctx.fill();
      drawHeart(0, -2, 5, "#ff5d8f");
    } else if (kind === "bow") {
      ctx.fillStyle = "#ff5d93";
      ctx.beginPath();
      ctx.ellipse(-8, 0, 8, 6, -0.4, 0, Math.PI * 2);
      ctx.ellipse(8, 0, 8, 6, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#c73670";
      ctx.beginPath();
      ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#f3b4cb";
      ctx.lineWidth = 2;
      roundRect(-12, -8, 24, 16, 3);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-12, -8);
      ctx.lineTo(0, 2);
      ctx.lineTo(12, -8);
      ctx.stroke();
      drawHeart(0, 2, 6, "#ff5d8f");
    }
    ctx.restore();
  }

  function drawPlatform(p) {
    ctx.fillStyle = "rgba(214, 120, 150, 0.15)";
    ctx.beginPath();
    ctx.ellipse(p.x + p.w / 2, p.y + 26, p.w * 0.36, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffd3e4";
    roundRect(p.x, p.y + 6, p.w, 16, 10);
    ctx.fill();
    ctx.fillStyle = "#fff6fb";
    roundRect(p.x + 4, p.y, p.w - 8, 14, 8);
    ctx.fill();
    const rand = mulberry32(Math.floor(p.baseX || p.x));
    const colors = ["#ff8fb8", "#ffe08a", "#9fd0ff", "#fff"];
    for (let i = 0; i < p.w / 22; i++) {
      ctx.fillStyle = colors[i % colors.length];
      ctx.fillRect(p.x + 12 + rand() * (p.w - 24), p.y + 4, 3, 7);
    }
  }

  function drawMailbox(x, raise) {
    ctx.fillStyle = "#e7b8c8";
    roundRect(x - 4, GROUND_Y - 70, 8, 70, 3);
    ctx.fill();
    ctx.fillStyle = "#ff7eae";
    roundRect(x - 22, GROUND_Y - 108, 44, 36, 10);
    ctx.fill();
    ctx.fillStyle = "#fff";
    roundRect(x - 14, GROUND_Y - 98, 28, 16, 4);
    ctx.fill();
    drawHeart(x, GROUND_Y - 92, 7, "#ff5d8f");
    ctx.save();
    ctx.translate(x + 22, GROUND_Y - 100);
    ctx.rotate(-0.8 + raise * 0.9);
    ctx.fillStyle = raise > 0.6 ? "#ffd56a" : "#fff";
    roundRect(0, -3, 16, 6, 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStar(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(state.time * 0.6);
    ctx.fillStyle = "#ffe08a";
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const r = i % 2 ? size * 0.4 : size;
      const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPet(id, x, y) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (id === "butterfly") {
      const flap = Math.sin(state.time * 10) * 6;
      ctx.fillStyle = "#ff8fb8";
      ctx.beginPath();
      ctx.ellipse(-8, -28 + flap * 0.1, 8, 5 + flap * 0.15, -0.4, 0, Math.PI * 2);
      ctx.ellipse(8, -28 - flap * 0.1, 8, 5 + flap * 0.15, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6d3148";
      ctx.fillRect(-1, -34, 2, 12);
    } else if (id === "bunny") {
      ctx.fillStyle = "#fffefb";
      ctx.beginPath();
      ctx.ellipse(-4, -40, 3, 8, -0.2, 0, Math.PI * 2);
      ctx.ellipse(4, -40, 3, 8, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, -26, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffb7cf";
      ctx.beginPath();
      ctx.arc(-3, -26, 1.2, 0, Math.PI * 2);
      ctx.arc(3, -26, 1.2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#fff6ea";
      ctx.beginPath();
      ctx.arc(0, -22, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-8, -26); ctx.lineTo(-12, -36); ctx.lineTo(-2, -28); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(8, -26); ctx.lineTo(12, -36); ctx.lineTo(2, -28); ctx.fill();
      ctx.fillStyle = "#ff8fb8";
      ctx.beginPath();
      ctx.arc(0, -20, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFollowers(anchorX, anchorY, facing) {
    progress.pets.forEach((id, i) => {
      if (!followerPos[id]) followerPos[id] = { x: anchorX - facing * 40, y: anchorY };
      const pet = followerPos[id];
      const goal = anchorX - facing * (52 + i * 34);
      pet.x += (goal - pet.x) * 0.12;
      pet.y += (anchorY - pet.y) * 0.14;
      drawPet(id, pet.x, pet.y - Math.sin(state.time * 5 + i) * 3);
    });
  }

  function drawKitty(x, y, mood) {
    const k = state.kitty;
    const moving = Math.abs(k.vx) > 24 && mood === "walk";
    const bob = reduceMotion ? 0 : Math.sin(state.time * (moving ? 12 : 2.2)) * (moving ? 2.2 : 1.4);
    const walk = moving ? Math.sin(state.time * 12) : 0;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y + bob));
    if (state.invuln > 0 && Math.sin(state.time * 16) > 0) ctx.globalAlpha = 0.45;
    const stretch = mood === "walk" ? clamp(1 - k.vy / 2800, 0.9, 1.08) : 1;
    ctx.scale(1 / stretch, stretch);
    ctx.fillStyle = "rgba(180, 90, 120, 0.16)";
    ctx.beginPath();
    ctx.ellipse(0, -2, 22, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    const leg = (lx, swing) => {
      ctx.save();
      ctx.translate(lx, -16);
      ctx.rotate(swing);
      ctx.fillStyle = "#fffefb";
      roundRect(-5, 0, 10, 16, 5);
      ctx.fill();
      ctx.fillStyle = "#ffd0e2";
      roundRect(-6, 12, 12, 7, 3);
      ctx.fill();
      ctx.restore();
    };
    leg(-10, walk * 0.45);
    leg(10, -walk * 0.45);

    const outfit = progress.equipped;
    ctx.fillStyle = outfit === "pajama" ? "#d7c4ff" : outfit === "sleep" ? "#6d7cdb" : outfit === "garden" ? "#ffb7d0" : "#ff8fbe";
    roundRect(-20, -48, 40, 34, 14);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(-12, -46);
    ctx.lineTo(0, -34);
    ctx.lineTo(12, -46);
    ctx.fill();

    ctx.fillStyle = "#fffefb";
    ctx.beginPath();
    ctx.moveTo(-24, -78);
    ctx.lineTo(-16, -112);
    ctx.lineTo(-2, -80);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(4, -80);
    ctx.lineTo(18, -114);
    ctx.lineTo(26, -76);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffd0e2";
    ctx.beginPath();
    ctx.moveTo(-18, -84);
    ctx.lineTo(-14, -102);
    ctx.lineTo(-6, -84);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fffefb";
    ctx.beginPath();
    ctx.arc(0, -68, 26, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ff4f8d";
    ctx.beginPath();
    ctx.ellipse(24, -82, 10, 7, 0.5, 0, Math.PI * 2);
    ctx.ellipse(16, -90, 8, 6, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(20, -84, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(18, -86, 1.6, 0, Math.PI * 2);
    ctx.fill();
    if (outfit === "bow") {
      ctx.fillStyle = "#ff4f8d";
      ctx.beginPath();
      ctx.ellipse(22, -78, 14, 9, 0.4, 0, Math.PI * 2);
      ctx.ellipse(10, -92, 11, 8, -0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    if (outfit === "pajama" || outfit === "sleep") {
      ctx.fillStyle = outfit === "sleep" ? "#4454b8" : "#f6e4ff";
      ctx.beginPath();
      ctx.moveTo(-8, -90);
      ctx.quadraticCurveTo(2, -132, 14, -88);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(2, -124, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    if (outfit === "garden") {
      drawFlower(-8, -108, 0.55, 0);
      drawFlower(8, -110, 0.5, 1);
    }
    if (outfit === "sleep") drawHeart(0, -36, 6, "#ffe08a");

    const blink = !reduceMotion && (state.time % 4.2) < 0.12;
    ctx.fillStyle = "#3a3140";
    ctx.beginPath();
    ctx.ellipse(-9, -70, 3.1, blink ? 0.6 : 4.3, 0, 0, Math.PI * 2);
    ctx.ellipse(8, -70, 3.1, blink ? 0.6 : 4.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffb3c9";
    ctx.beginPath();
    ctx.ellipse(-16, -62, 4.5, 2.4, 0, 0, Math.PI * 2);
    ctx.ellipse(15, -62, 4.5, 2.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f0b429";
    ctx.beginPath();
    ctx.ellipse(0, -64, 3.2, 2.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#3a3140";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(0, -60, 4, 0.25, Math.PI - 0.25);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-18, -66); ctx.lineTo(-30, -68);
    ctx.moveTo(-18, -62); ctx.lineTo(-31, -62);
    ctx.moveTo(16, -66); ctx.lineTo(28, -68);
    ctx.moveTo(16, -62); ctx.lineTo(29, -62);
    ctx.stroke();
    if (state.mode !== "start" && collected().hearts > 0) drawHeart(0, -34, 7, "#ff5d8f");

    if (state.tear > 0) {
      ctx.fillStyle = "#8ec7ef";
      ctx.beginPath();
      ctx.ellipse(-9, -60, 2, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const wave = mood === "wave" || mood === "cheer";
    ctx.save();
    ctx.translate(-22, -46);
    ctx.rotate(wave ? Math.sin(state.time * 6) * 0.5 - 0.8 : walk * 0.2 + 0.15);
    ctx.fillStyle = "#fffefb";
    roundRect(-4, 0, 8, 16, 4);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(20, -44);
    ctx.rotate(0.4);
    ctx.fillStyle = "#fffefb";
    roundRect(-4, 0, 8, 14, 4);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawDear(x, y) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.fillStyle = "rgba(180, 90, 120, 0.16)";
    ctx.beginPath();
    ctx.ellipse(0, -2, 20, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#d7ecff";
    roundRect(-18, -46, 36, 32, 12);
    ctx.fill();
    ctx.fillStyle = "#fffefb";
    ctx.beginPath();
    ctx.arc(0, -64, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-16, -74); ctx.lineTo(-6, -70); ctx.lineTo(-12, -56); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(16, -74); ctx.lineTo(6, -70); ctx.lineTo(12, -56); ctx.fill();
    ctx.fillStyle = "#7eb6ef";
    ctx.beginPath();
    ctx.moveTo(0, -50);
    ctx.lineTo(-8, -40);
    ctx.lineTo(0, -36);
    ctx.lineTo(8, -40);
    ctx.fill();
    ctx.fillStyle = "#3a3140";
    ctx.beginPath();
    ctx.ellipse(-8, -66, 2.8, 4, 0, 0, Math.PI * 2);
    ctx.ellipse(8, -66, 2.8, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f0b429";
    ctx.beginPath();
    ctx.ellipse(0, -60, 3, 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#3a3140";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(0, -56, 3.5, 0.2, Math.PI - 0.2);
    ctx.stroke();
    ctx.fillStyle = "#ffb3c9";
    ctx.beginPath();
    ctx.ellipse(-14, -58, 4, 2.2, 0, 0, Math.PI * 2);
    ctx.ellipse(14, -58, 4, 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(-18, -40);
    ctx.rotate(Math.sin(state.time * 4) * 0.4 - 0.6);
    ctx.fillStyle = "#fffefb";
    roundRect(-3, 0, 7, 14, 3);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawGround(x0, width, gaps) {
    const end = x0 + width;
    const holes = (gaps || []).slice().sort((a, b) => a.x - b.x);
    const spans = [];
    let cursor = x0;
    holes.forEach((g) => {
      const left = Math.max(g.x, x0);
      const right = Math.min(g.x + g.w, end);
      if (left > cursor) spans.push([cursor, left - cursor]);
      cursor = Math.max(cursor, right);
    });
    if (cursor < end) spans.push([cursor, end - cursor]);
    spans.forEach(([sx, sw]) => {
      if (sw < 2) return;
      ctx.fillStyle = "#b7e7c8";
      ctx.fillRect(sx, GROUND_Y, sw, 800);
      ctx.fillStyle = "#8fd4a8";
      ctx.fillRect(sx, GROUND_Y, sw, 16);
      ctx.fillStyle = "#ffd3e4";
      roundRect(sx, GROUND_Y - 8, sw, 18, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.65)";
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(sx, GROUND_Y);
      ctx.lineTo(sx + sw, GROUND_Y);
      ctx.stroke();
      ctx.setLineDash([]);
    });
    holes.forEach((g) => {
      if (g.x + g.w < x0 || g.x > end) return;
      ctx.fillStyle = "#7ec8ea";
      ctx.fillRect(g.x, GROUND_Y - 6, g.w, 150);
      ctx.fillStyle = "#b7e6ff";
      ctx.fillRect(g.x, GROUND_Y - 6, g.w, 18);
      for (let i = 0; i < 3; i++) {
        const px = g.x + 18 + i * (g.w / 3);
        const py = GROUND_Y + 16 + Math.sin(state.time * 2 + i) * 3;
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.beginPath();
        ctx.ellipse(px, py, 10, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      if (g.w > 70) {
        ctx.fillStyle = "#7dce7a";
        ctx.beginPath();
        ctx.ellipse(g.x + g.w * 0.35, GROUND_Y + 8, 16, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ff8fb8";
        ctx.beginPath();
        ctx.ellipse(g.x + g.w * 0.35, GROUND_Y + 2, 4, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function drawHurdle(h) {
    const top = GROUND_Y - h.h;
    ctx.fillStyle = "rgba(214, 120, 150, 0.16)";
    ctx.beginPath();
    ctx.ellipse(h.x + h.w / 2, GROUND_Y + 2, h.w * 0.46, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    roundRect(h.x, top, 8, h.h, 4);
    roundRect(h.x + h.w - 8, top, 8, h.h, 4);
    ctx.fill();
    ctx.fillStyle = "#ff8fbe";
    roundRect(h.x + 2, top + 4, 4, h.h - 8, 2);
    roundRect(h.x + h.w - 6, top + 4, 4, h.h - 8, 2);
    ctx.fill();
    ctx.strokeStyle = "#ff5d8f";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(h.x + 4, top + 14);
    ctx.quadraticCurveTo(h.x + h.w / 2, top + 30, h.x + h.w - 4, top + 14);
    ctx.stroke();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(h.x + 6, top + 16);
    ctx.quadraticCurveTo(h.x + h.w / 2, top + 26, h.x + h.w - 6, top + 16);
    ctx.stroke();
    drawHeart(h.x + h.w / 2, top + 8, 7, "#ff4d7a");
  }

  function drawCheckpoint(x) {
    const on = (state.checkpoint || 0) >= x;
    ctx.fillStyle = on ? "#ff8fbe" : "#ffd6e6";
    roundRect(x - 3, GROUND_Y - 58, 6, 58, 3);
    ctx.fill();
    ctx.fillStyle = on ? "#fff" : "#ffe4ef";
    ctx.beginPath();
    ctx.arc(x, GROUND_Y - 64, 8, 0, Math.PI * 2);
    ctx.fill();
    drawHeart(x, GROUND_Y - 64, 7, on ? "#ff4d7a" : "#ffb3cc");
  }

  function drawPatch(p) {
    ctx.fillStyle = "rgba(255, 182, 210, 0.45)";
    ctx.beginPath();
    ctx.ellipse(p.x + p.w / 2, GROUND_Y + 2, p.w / 2, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < p.w / 28; i++) {
      const x = p.x + 16 + i * 28;
      ctx.fillStyle = "#7dce7a";
      ctx.fillRect(x, GROUND_Y - 22, 3, 18);
      ctx.fillStyle = i % 2 ? "#ff8fb8" : "#ffe08a";
      ctx.beginPath();
      ctx.ellipse(x + 1, GROUND_Y - 26, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBerry(b) {
    ctx.save();
    ctx.translate(b.x, GROUND_Y - 16);
    ctx.rotate(Math.sin(b.t) * 0.4);
    ctx.fillStyle = "#ff3d68";
    ctx.beginPath();
    ctx.arc(0, 2, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffe08a";
    [[-5, 0], [3, 3], [0, 8], [5, -2]].forEach(([sx, sy]) => {
      ctx.beginPath();
      ctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = "#3eaf62";
    ctx.beginPath();
    ctx.ellipse(-4, -12, 6, 3.5, -0.6, 0, Math.PI * 2);
    ctx.ellipse(4, -12, 6, 3.5, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBee(b) {
    const y = b.y + Math.sin(state.time * 3 + b.x) * 3;
    ctx.save();
    ctx.translate(b.x, y);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.ellipse(-5, -8, 7, 4, -0.5, 0, Math.PI * 2);
    ctx.ellipse(5, -8, 7, 4, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffd56a";
    ctx.beginPath();
    ctx.ellipse(0, 0, 13, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#6d3148";
    ctx.fillRect(-7, -7, 3, 14);
    ctx.fillRect(1, -7, 3, 14);
    ctx.strokeStyle = "#6d3148";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(9, -1, 2.2, 0.15, Math.PI - 0.15);
    ctx.stroke();
    ctx.fillStyle = "#a1265c";
    ctx.font = "700 11px Nunito, sans-serif";
    ctx.fillText("z", 14, -12);
    ctx.restore();
  }

  function drawCourseButterfly(b) {
    const y = b.yDraw || b.y;
    const flap = Math.sin(state.time * 8 + b.x) * 5;
    ctx.save();
    ctx.translate(b.x, y);
    ctx.fillStyle = "#ff8fb8";
    ctx.beginPath();
    ctx.ellipse(-8, flap * 0.15, 9, 6 + flap * 0.2, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c9b6ff";
    ctx.beginPath();
    ctx.ellipse(8, flap * 0.15, 9, 6 + flap * 0.2, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#6d3148";
    ctx.beginPath();
    ctx.ellipse(0, 0, 2.4, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHills() {
    ctx.save();
    ctx.translate(state.camX * 0.55, 0);
    const base = GROUND_Y - 10;
    ctx.fillStyle = "#ffd7e8";
    ctx.beginPath();
    ctx.moveTo(-400, base);
    for (let x = -400; x < 5200; x += 180) {
      ctx.quadraticCurveTo(x + 70, base - 70, x + 160, base);
    }
    ctx.lineTo(5200, base + 200);
    ctx.lineTo(-400, base + 200);
    ctx.fill();
    ctx.fillStyle = "#ffe7f2";
    ctx.beginPath();
    ctx.moveTo(-400, base + 10);
    for (let x = -360; x < 5200; x += 220) {
      ctx.quadraticCurveTo(x + 80, base - 36, x + 200, base + 10);
    }
    ctx.lineTo(5200, base + 180);
    ctx.lineTo(-400, base + 180);
    ctx.fill();
    ctx.restore();
  }

  function backdropLevel() {
    const scene = state.mode === "settings" ? state.settingsFrom : state.mode;
    if (scene === "finale") {
      return { sky: ["#1a1038", "#4a3478", "#f3b7cf"], mood: "night" };
    }
    if (state.levelKind === "sleep" && scene !== "start" && scene !== "finale") return SLEEP;
    const idx = scene === "start" ? 0 : state.levelIndex;
    return LEVELS[idx] || LEVELS[0];
  }

  function drawBackdrop() {
    const level = backdropLevel();
    const g = ctx.createLinearGradient(0, 0, 0, state.viewH);
    g.addColorStop(0, level.sky[0]);
    g.addColorStop(0.55, level.sky[1]);
    g.addColorStop(1, level.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, state.viewW, state.viewH);

    const sunX = state.viewW * (level.mood === "sunset" ? 0.72 : 0.82);
    const sunY = state.viewH * 0.16;
    const glow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 90);
    if (level.mood === "night") {
      glow.addColorStop(0, "rgba(255, 244, 210, 0.9)");
      glow.addColorStop(1, "rgba(255, 244, 210, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff6cf";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 16, 0.4, Math.PI * 2 - 0.15);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 244, 190, 0.85)";
      for (let i = 0; i < 18; i++) {
        ctx.beginPath();
        ctx.arc((i * 97) % state.viewW, (i * 53) % (state.viewH * 0.45), i % 3 === 0 ? 1.8 : 1, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (level.mood === "dusk") {
      glow.addColorStop(0, "rgba(255, 244, 200, 0.95)");
      glow.addColorStop(1, "rgba(255, 244, 200, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff6cf";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 22, 0.7, Math.PI * 2 - 0.2);
      ctx.fill();
    } else {
      glow.addColorStop(0, "rgba(255, 236, 170, 0.95)");
      glow.addColorStop(1, "rgba(255, 236, 170, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffe38a";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion) {
      petals.forEach((p) => {
        p.y += p.v * 0.016 * 60;
        p.drift += 0.01;
        if (p.y > 1.1) { p.y = -0.05; p.x = Math.random(); }
        ctx.save();
        ctx.translate(p.x * state.viewW, p.y * state.viewH);
        ctx.rotate(Math.sin(p.drift) * 0.8);
        ctx.fillStyle = p.kind ? "rgba(255,170,200,0.75)" : "rgba(255,255,255,0.8)";
        ctx.beginPath();
        ctx.ellipse(0, 0, 5 * p.s, 3 * p.s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    if (level.mood === "rain") {
      ctx.strokeStyle = "rgba(170, 190, 220, 0.35)";
      ctx.lineWidth = 1.4;
      for (let i = 0; i < 28; i++) {
        const x = (i * 97 + state.time * 40) % state.viewW;
        const y = (i * 53 + state.time * 120) % state.viewH;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 3, y + 12);
        ctx.stroke();
      }
    }
  }

  function drawWorldExtras(level) {
    drawHills();
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 460 - state.camX * 0.25) % 2300 + 2300) % 2300 - 100;
      drawCloud(state.camX * 0.25 + cx, GROUND_Y - 250 - (i % 3) * 28, 1.4, "rgba(255,255,255,0.85)");
    }
    drawGround(-200, level.width + 400, level.gaps);
    state.flowers.forEach((f) => {
      const wet = (level.gaps || []).some((g) => f.x > g.x - 6 && f.x < g.x + g.w + 6);
      if (!wet) drawFlower(f.x, GROUND_Y + 28, f.s, f.k);
    });
  }

  function drawPlayfield() {
    const level = current();
    drawWorldExtras(level);
    level.platforms.forEach(drawPlatform);
    (level.hurdles || []).forEach(drawHurdle);
    (level.patches || []).forEach(drawPatch);
    (level.checks || []).forEach(drawCheckpoint);
    (level.berries || []).forEach(drawBerry);
    (level.bees || []).forEach(drawBee);
    (level.butterflies || []).forEach(drawCourseButterfly);
    level.clouds.forEach((c) => {
      if (c.y < 320) {
        drawCloud(c.x, c.yDraw, 1.05, "rgba(255,255,255,0.9)");
        ctx.fillStyle = "#ffb7cf";
        ctx.beginPath();
        ctx.ellipse(c.x + 10, c.yDraw + 4, 4, 2.3, 0, 0, Math.PI * 2);
        ctx.fill();
      } else drawWorry(c);
    });
    level.pickups.forEach((item) => {
      if (item.got) return;
      const iy = item.y + Math.sin(state.time * 2.5 + item.phase) * (reduceMotion ? 0 : 7);
      ctx.fillStyle = "rgba(190,110,140,0.12)";
      ctx.beginPath();
      ctx.ellipse(item.x, iy + 22, 10, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      if (item.type === "heart" && item.kind === "star") drawStar(item.x, iy, item.bonus ? 12 : 16);
      else if (item.type === "heart") drawHeart(item.x, iy, item.bonus ? 16 : 22, item.bonus ? "#ff8fb3" : "#ff4d7a");
      else drawGift(item.x, iy, item.kind);
    });
    drawMailbox(level.width - 150, state.flag);
    const mood = state.phase === "clearing" || state.mode === "letter" ? "cheer" : "walk";
    drawFollowers(state.kitty.x, state.kitty.y, state.kitty.facing || 1);
    drawKitty(state.kitty.x, state.kitty.y, mood);
    state.particles.forEach((p) => {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      if (p.kind === "heart") drawHeart(p.x, p.y, p.size, p.color);
      else if (p.kind === "drop") {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size * 0.4, p.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
    if (level.mood === "dusk" || level.mood === "sunset" || level.mood === "night") {
      for (let i = 0; i < 12; i++) {
        const fx = (i * 280 + Math.sin(state.time + i) * 20) % level.width;
        const fy = 180 + (i % 5) * 30 + Math.sin(state.time * 2 + i) * 8;
        ctx.fillStyle = `rgba(255, 244, 190, ${0.35 + Math.sin(state.time * 3 + i) * 0.3})`;
        ctx.beginPath();
        ctx.arc(fx, fy, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawMenuScene() {
    drawWorldExtras(LEVELS[0]);
    const left = state.camX + viewWorldW() * 0.22;
    const right = state.camX + viewWorldW() * 0.78;
    ctx.save();
    ctx.translate(left, GROUND_Y);
    ctx.scale(1.18, 1.18);
    ctx.translate(-left, -GROUND_Y);
    drawFollowers(left - 70, GROUND_Y, 1);
    drawKitty(left, GROUND_Y, "wave");
    ctx.restore();
    if (viewWorldW() > 460) drawDear(right, GROUND_Y);
    const span = right - left;
    for (let i = 1; i <= 4; i++) {
      const u = i / 5;
      const x = left + span * u;
      const y = GROUND_Y - 120 - Math.sin(u * Math.PI) * 70 + Math.sin(state.time * 2 + i) * 4;
      drawHeart(x, y, 10 + (i % 2), "#ff5d8f");
    }
  }

  function drawFinaleScene() {
    drawHills();
    drawGround(state.camX - 100, viewWorldW() + 200);
    const left = state.camX + Math.max(70, viewWorldW() * 0.18);
    const right = state.camX + viewWorldW() - Math.max(70, viewWorldW() * 0.18);
    drawFollowers(left, GROUND_Y, 1);
    drawKitty(left, GROUND_Y, "wave");
    drawDear(right, GROUND_Y);
    {
      for (let i = 0; i < 16; i++) {
        const fx = state.camX + ((i * 140 + state.time * 18) % (viewWorldW() + 40)) - 20;
        const fy = GROUND_Y - 80 - (i % 6) * 28 + Math.sin(state.time * 2 + i) * 10;
        ctx.fillStyle = `rgba(255, 236, 150, ${0.35 + Math.sin(state.time * 4 + i) * 0.35})`;
        ctx.beginPath();
        ctx.arc(fx, fy, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 10; i++) {
        const px = state.camX + (i * 0.11 * viewWorldW() + Math.sin(state.time + i) * 12);
        const py = ((state.time * 24 + i * 48) % (GROUND_Y + 20));
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(Math.sin(state.time + i));
        ctx.fillStyle = i % 2 ? "rgba(255,170,200,0.8)" : "rgba(255,255,255,0.75)";
        ctx.beginPath();
        ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    const planeT = (state.time * 0.12) % 1;
    for (let i = 0; i <= 6; i++) {
      const u = i / 6;
      const x = left + (right - left) * u;
      const y = GROUND_Y - 150 - Math.sin(u * Math.PI) * 120 + Math.sin(state.time * 2 + i) * 3;
      drawHeart(x, y, 11, i % 2 ? "#ff4d7a" : "#ff8fb3");
    }
    const px = left + (right - left) * planeT;
    const py = GROUND_Y - 150 - Math.sin(planeT * Math.PI) * 120;
    ctx.save();
    ctx.translate(px, py - 16);
    ctx.rotate(-0.3 + planeT * 0.5);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-12, 7);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-12, -7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    const dpr = state.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackdrop();
    const s = state.scale * dpr;
    ctx.setTransform(s, 0, 0, s, -state.camX * s, -state.camY * s);
    const scene = state.mode === "settings" ? state.settingsFrom : state.mode;
    if (scene === "finale") drawFinaleScene();
    else if (scene === "start") drawMenuScene();
    else drawPlayfield();
    if (state.mode === "pause" || state.mode === "over" || state.mode === "notes" || state.mode === "letter" || state.mode === "settings") {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "rgba(255, 214, 230, 0.28)";
      ctx.fillRect(0, 0, state.viewW, state.viewH);
    }
  }

  function loop(ts) {
    if (!loop.last) loop.last = ts;
    const dt = Math.min(0.033, (ts - loop.last) / 1000);
    loop.last = ts;
    const scene = state.mode === "settings" ? state.settingsFrom : state.mode;
    if (scene === "start" || scene === "finale") {
      state.time += dt;
      state.camX = 0;
      state.camY = GROUND_Y - (state.viewH - bottomReserve() - footPad()) / state.scale;
      state.kitty.vx = 0;
    } else {
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", (e) => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") {
      keys.jump = true;
      if (!e.repeat && state.mode === "play") requestJump();
    }
    if (e.code === "KeyM") {
      userMuted = musicOn;
      setMusic(!musicOn);
    }
    if (e.code === "Escape") {
      if (state.mode === "play") openPause();
      else if (state.mode === "pause") resume();
      else if (state.mode === "notes") closeNotes();
      else if (state.mode === "settings") closeSettings();
    }
    if (e.code === "Enter" && state.mode === "start") begin();
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.jump = false;
  });
  document.addEventListener("touchmove", (e) => {
    if (e.target.closest("input, .note-list, .panel")) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && audio) audio.ctx.suspend();
    else if (audio && musicOn) audio.ctx.resume();
  });

  document.getElementById("btn-begin").addEventListener("click", begin);
  document.getElementById("btn-next").addEventListener("click", nextLevel);
  document.getElementById("btn-retry").addEventListener("click", retryLevel);
  document.getElementById("btn-resume").addEventListener("click", resume);
  document.getElementById("btn-restart").addEventListener("click", retryLevel);
  pauseBtn.addEventListener("click", openPause);
  document.getElementById("btn-notes-start").addEventListener("click", () => openNotes("start"));
  document.getElementById("btn-notes-pause").addEventListener("click", () => openNotes("pause"));
  document.getElementById("btn-notes-finale").addEventListener("click", () => openNotes("finale"));
  document.getElementById("btn-notes-back").addEventListener("click", closeNotes);
  document.getElementById("btn-settings").addEventListener("click", openSettings);
  document.getElementById("btn-settings-close").addEventListener("click", closeSettings);
  document.getElementById("lang-select").addEventListener("change", (e) => {
    applyLanguage(e.target.value);
  });
  function startSleep() {
    ensureAudio();
    if (!userMuted) setMusic(true);
    loadSleep();
    state.mode = "play";
    showScreen(null);
    syncHud();
  }
  document.getElementById("btn-sleep-start").addEventListener("click", startSleep);
  document.getElementById("btn-sleep-pause").addEventListener("click", startSleep);
  document.getElementById("book-tabs").addEventListener("click", (e) => {
    const tab = e.target.closest("[data-book]");
    if (!tab) return;
    bookTab = tab.dataset.book;
    renderNotes();
  });
  document.getElementById("note-list").addEventListener("click", (e) => {
    const outfit = e.target.closest("[data-outfit]");
    if (outfit && !outfit.disabled) equipOutfit(outfit.dataset.outfit);
  });
  document.getElementById("btn-again").addEventListener("click", begin);
  musicBtn.addEventListener("click", () => {
    userMuted = musicOn;
    setMusic(!musicOn);
    if (!musicOn) userMuted = true;
  });
  volumeEl.addEventListener("input", () => {
    ensureAudio();
    if (!audio) return;
    audio.volume.gain.setTargetAtTime(volAmount(), audio.ctx.currentTime, 0.05);
  });
  holdButton(document.getElementById("btn-left"), "left");
  holdButton(document.getElementById("btn-right"), "right");
  holdButton(document.getElementById("btn-jump"), "jump");

  const coarse = matchMedia("(pointer: coarse), (max-width: 860px)");
  const syncControls = () => document.body.classList.toggle("show-controls", coarse.matches);
  coarse.addEventListener?.("change", syncControls);
  syncControls();

  resize();
  state.flowers = makeFlowers(2800, 100);
  livesEl.innerHTML = '<span class="lives"><span class="on">🎀</span><span class="on">🎀</span><span class="on">🎀</span></span>';
  state.unlocked = progress.letters.slice();
  showScreen("start");
  applyLanguage(readSavedLang());
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
